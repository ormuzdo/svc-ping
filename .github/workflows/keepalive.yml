name: keepalive

# GitHub вимикає крон-воркфлоу після 60 днів без активності в репо.
# Раз на ~20 днів робимо коміт-мітку, щоб моніторинг не зупинявся сам.

on:
  schedule:
    - cron: '11 4 */20 * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  poke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          date -u '+%F %H:%M UTC' > .keepalive
          git add .keepalive
          git commit -m "keepalive" || exit 0
          git push
